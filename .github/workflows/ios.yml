name: iOS CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-test-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode
        run: xcodebuild -version
      - name: Validate OpenStep project file
        run: plutil -lint GymForTeenage.xcodeproj/project.pbxproj
      - name: Confirm Xcode can read project and scheme
        run: xcodebuild -list -project GymForTeenage.xcodeproj
      - name: Run XCTest suite
        run: xcodebuild test -project GymForTeenage.xcodeproj -scheme GymForTeenage -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO
      - name: Xcode static analysis
        run: xcodebuild analyze -project GymForTeenage.xcodeproj -scheme GymForTeenage -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO
      - name: Archive without personal signing
        run: xcodebuild archive -project GymForTeenage.xcodeproj -scheme GymForTeenage -configuration Release -sdk iphoneos -archivePath build/GymForTeenage.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package and inspect unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/GymForTeenage.xcarchive/Products/Applications/GymForTeenage.app"
          plutil -lint "$APP_PATH/Info.plist"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/
          (cd package && zip -qr ../GymForTeenage-unsigned-ipa-for-esign-validation.ipa Payload)
          unzip -t GymForTeenage-unsigned-ipa-for-esign-validation.ipa
          python3 scripts/validate_ipa.py "$APP_PATH" GymForTeenage-unsigned-ipa-for-esign-validation.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-for-esign-validation
          path: GymForTeenage-unsigned-ipa-for-esign-validation.ipa
          if-no-files-found: error
