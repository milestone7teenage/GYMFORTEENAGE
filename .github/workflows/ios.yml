name: iOS CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-test-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode
        run: xcodebuild -version
      - name: Validate OpenStep project file
        run: plutil -lint GymForTeenage.xcodeproj/project.pbxproj
      - name: Confirm Xcode can read project and scheme
        run: xcodebuild -list -project GymForTeenage.xcodeproj
- name: Build XCTest bundle with Simulator signing
        run: |
          set -euo pipefail
          echo "XCTEST_BUILD_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project GymForTeenage.xcodeproj -scheme GymForTeenage -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES
- name: Verify XCTest host and Keychain entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/GymForTeenage.app"
          APP_EXECUTABLE="$APP_PATH/GymForTeenage"
          EXPECTED_TEST_HOST="$PWD/$APP_EXECUTABLE"
          test -x "$APP_EXECUTABLE"

          BUILD_SETTINGS="$(xcodebuild -showBuildSettings -project GymForTeenage.xcodeproj -scheme GymForTeenage -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData test)"
          TEST_TARGET_SETTINGS="$(printf '%s\n' "$BUILD_SETTINGS" | awk '
            /^Build settings for action .* and target GymForTeenageTests:/ { in_test_target = 1; next }
            /^Build settings for action .* and target / { if (in_test_target) exit; in_test_target = 0 }
            in_test_target { print }
          ')"
          TEST_HOST="$(printf '%s\n' "$TEST_TARGET_SETTINGS" | awk '/^[[:space:]]*TEST_HOST = / { print $3; exit }')"
          BUNDLE_LOADER="$(printf '%s\n' "$TEST_TARGET_SETTINGS" | awk '/^[[:space:]]*BUNDLE_LOADER = / { print $3; exit }')"
          if [[ "$TEST_HOST" != "$EXPECTED_TEST_HOST" || "$BUNDLE_LOADER" != "$EXPECTED_TEST_HOST" ]]; then
            echo "GymForTeenageTests is not configured to load in the built app host."
            echo "TEST_HOST=$TEST_HOST"
            echo "BUNDLE_LOADER=$BUNDLE_LOADER"
            echo "Expected=$EXPECTED_TEST_HOST"
            exit 1
          fi
          echo "XCTest host verified: $TEST_HOST"

          ENTITLEMENTS_XML_PATH="build/app-host-entitlements.xml"
          APP_TARGET_BUILD_ROOT="build/DerivedData/Build/Intermediates.noindex/GymForTeenage.build"
          ENTITLEMENTS_SOURCE_PATH="$(find "$APP_TARGET_BUILD_ROOT" -type f -path '*/GymForTeenage.build/GymForTeenage.app-Simulated.xcent' -print -quit)"
          if [[ -z "$ENTITLEMENTS_SOURCE_PATH" || ! -s "$ENTITLEMENTS_SOURCE_PATH" ]]; then
            echo "Xcode-generated Simulator entitlements for GymForTeenage.app were not found."
            exit 1
          fi
          case "$ENTITLEMENTS_SOURCE_PATH" in
            "$APP_TARGET_BUILD_ROOT"/*/GymForTeenage.build/GymForTeenage.app-Simulated.xcent) ;;
            *) echo "Simulator entitlements are outside the GymForTeenage app target build directory."; exit 1 ;;
          esac
          ENTITLEMENTS_MTIME="$(stat -f %m "$ENTITLEMENTS_SOURCE_PATH")"
          APP_EXECUTABLE_MTIME="$(stat -f %m "$APP_EXECUTABLE")"
          if [[ "$ENTITLEMENTS_MTIME" -lt "$XCTEST_BUILD_STARTED_EPOCH" || "$APP_EXECUTABLE_MTIME" -lt "$XCTEST_BUILD_STARTED_EPOCH" ]]; then
            echo "The app host or its Simulator entitlements predate this XCTest build."
            exit 1
          fi
          echo "App host entitlements source: $ENTITLEMENTS_SOURCE_PATH"
          echo "Xcode Simulator entitlement format: $(file -b "$ENTITLEMENTS_SOURCE_PATH")"
          plutil -convert xml1 -o "$ENTITLEMENTS_XML_PATH" "$ENTITLEMENTS_SOURCE_PATH"
          plutil -lint "$ENTITLEMENTS_XML_PATH"
          cat "$ENTITLEMENTS_XML_PATH"
          python3 - "$APP_PATH/Info.plist" "$ENTITLEMENTS_XML_PATH" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as info_file:
              bundle_id = plistlib.load(info_file).get("CFBundleIdentifier")
          with open(sys.argv[2], "rb") as entitlements_file:
              entitlements = plistlib.load(entitlements_file)

          app_identifier = entitlements.get("application-identifier")
          has_matching_app_identifier = (
              isinstance(app_identifier, str)
              and isinstance(bundle_id, str)
              and (app_identifier == bundle_id or app_identifier.endswith("." + bundle_id))
          )
          if not has_matching_app_identifier:
              raise SystemExit("App host application-identifier is missing or does not match CFBundleIdentifier.")

          if "keychain-access-groups" in entitlements:
              access_groups = entitlements["keychain-access-groups"]
              if not isinstance(access_groups, list) or not access_groups or any(
                  not isinstance(group, str) or not group.strip() for group in access_groups
              ):
                  raise SystemExit("App host keychain-access-groups must be a non-empty array of non-empty strings.")
              print(f"App host Keychain access groups: {access_groups}")
          else:
              print("App host Keychain access groups: not explicitly set; application-identifier is the default group.")

          print(f"App host bundle identifier: {bundle_id}")
          print(f"App host application identifier: {app_identifier}")
          PY
- name: Run XCTest suite
        shell: bash
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "import sys,json; devs=[d['udid'] for r in json.load(sys.stdin)['devices'].values() for d in r if d.get('isAvailable') and 'iPhone' in d.get('name','')]; print(devs[0] if devs else '')")
          if [ -z "$SIM_ID" ]; then
            RUNTIME=$(xcrun simctl list runtimes iOS -j | python3 -c "import sys,json; r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable')]; print(r[-1])")
            DEV_TYPE=$(xcrun simctl list devicetypes iPhone -j | python3 -c "import sys,json; d=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'iPhone' in x.get('name','')]; print(d[-1])")
            SIM_ID=$(xcrun simctl create "CI-iPhone" "$DEV_TYPE" "$RUNTIME")
          fi
          xcodebuild test-without-building -project GymForTeenage.xcodeproj -scheme GymForTeenage -destination "id=$SIM_ID" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES
- name: Xcode static analysis
        run: xcodebuild analyze -project GymForTeenage.xcodeproj -scheme GymForTeenage -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Archive without personal signing
        run: xcodebuild archive -project GymForTeenage.xcodeproj -scheme GymForTeenage -configuration Release -sdk iphoneos -archivePath build/GymForTeenage.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package and inspect unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/GymForTeenage.xcarchive/Products/Applications/GymForTeenage.app"
          plutil -lint "$APP_PATH/Info.plist"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/
          (cd package && zip -qr ../GymForTeenage-unsigned-ipa-for-esign-validation.ipa Payload)
          unzip -t GymForTeenage-unsigned-ipa-for-esign-validation.ipa
          python3 scripts/validate_ipa.py "$APP_PATH" GymForTeenage-unsigned-ipa-for-esign-validation.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-for-esign-validation
          path: GymForTeenage-unsigned-ipa-for-esign-validation.ipa
          if-no-files-found: error
